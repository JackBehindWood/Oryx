[project]
name = "Oryx"
description = "Game strategy engine"
license = "Apache-2.0"
repository = "https://github.com/JackBehindWood/Oryx"
default-target = "oasis"
forge-version = ">=0.2"

[premake]
version = "5.0.0-beta8"
generator = "gmake"

[build]
default-profile = "debug"
jobs = 0
dependencies-dir = "Oryx/vendor"
fetch = "auto"

[options]
python = { default = true, off = "--no-python", help = "Embedded Python backend" }
graphics = { default = true, off = "--no-graphics", help = "Window backends, RHI and 2D renderer" }
sanitize = { default = false, on = "--sanitize", help = "ASan+UBSan diagnostic build" }

[targets.oasis]
project = "Oasis"
presets.bench = ["--simulate=random,first-legal,100", "--benchmark", "--no-window"]

[tests]
project = "Tests"
suites.unit = "tests/unit"
suites.integration = "tests/integration"
suites.benchmark = { dir = "tests/benchmark", default = false }
suites.python = { dir = "tests/python", requires = ["python", "!sanitize"] }

[dependencies]
spdlog = { kind = "static", include = "include", sources = "src", defines = ["SPDLOG_COMPILED_LIB"] }
yaml-cpp = { kind = "static", include = "include", sources = "src" }
pybind11 = { include = "include", requires = ["python"] }
glfw = { kind = "static", include = "include", sources = "src", requires = ["graphics"] }
stb = { include = "." }
metal-cpp = { include = ".", requires = ["graphics"] }
doctest = { include = "doctest", path = "tests/vendor/doctest" }

[dependencies.slang]
kind = "tool"
source = "archive"
binary = "bin/slangc"
requires = ["graphics"]

[dependencies.slang.platforms.macos-aarch64]
url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-macos-aarch64.tar.gz"
sha256 = "fa46822c92d81404a7951de3746093985c1e6f520f4b533e2aa3bea576f0f2f0"

[dependencies.slang.platforms.macos-x86_64]
url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-macos-x86_64.tar.gz"
sha256 = "490b6447e3ea6c8fa9dfc45b1dc227db7cf80a60981c4390ed0fdc8ddbedee11"

[dependencies.slang.platforms.linux-x86_64]
url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-x86_64.tar.gz"
sha256 = "bd6cfc47b7353b2cffa36a866b1584749f76f4b2dbebf6dda26bc3fb40dc3c0e"

[dependencies.slang.platforms.linux-aarch64]
url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-aarch64.tar.gz"
sha256 = "eeefa4e52ca322cf3c037ee0d273b0ee68f4161fa422eda1bb704126073b69b4"

[boundaries]
root = "Oryx/src"
base = "Oryx"
rules = [
  { rule = "** !-> backends", why = "public headers must not include backends/" },
  { rule = "backend-header <-only- Core/Window.cpp Graphics/RHI/RHI.cpp", why = "only the backend factories Core/Window.cpp, Graphics/RHI/RHI.cpp may include a backend header" },
  { rule = "Assets !-> Core/Window.h Core/Input.h Events/WindowEvent.h except Assets/**/Gpu*", why = "CPU assets must stay headless" },
  { rule = "headless !-> graphics except Board/Graphics", why = "{module} must not include {target}; only Board/Graphics sits above the renderer" },
  { rule = "Assets !-> graphics except Assets/**/Gpu*", why = "only the Gpu* bridges may include {target}" },
  { rule = "graphics Text !-> Assets", why = "{module} must not include Assets; fonts reach the renderer through Text/IFontSource" },
  { rule = "Interface/Canvas !-> Interface/UI Interface/GUI Board Assets", why = "{module} is the shared immediate-mode layer; it must not include {target}" },
  { rule = "Interface/UI !-> Interface/GUI Board Assets Game Strategy", why = "{module} is the player-facing UI layer; it must not include {target}" },
  { rule = "Interface/GUI !-> Interface/UI Board Assets Game Strategy Dashboard", why = "{module} is the developer-tooling UI layer, a peer of Interface/UI; it must not include {target}" },
  { rule = "Dashboard/Feed !-> Board Assets", why = "{module} consumes only Decision data and labels; it must not include {target}" },
  { rule = "Dashboard/View !-> Board Assets", why = "{module} draws only feed records; it must not include {target}" },
  { rule = "Dashboard/Panel !-> Board Assets", why = "{module} hosts registered views over the feed; it must not include {target}" },
  { rule = "Core Game Strategy Simulation !-> Dashboard", why = "{module} is below the dashboard; it must not include {target}" },
  "Graphics < Shaders < Renderer < Interface/Canvas < Interface/UI < Board/Graphics",
  "Renderer < Interface/Canvas < Interface/GUI < Dashboard/View < Dashboard/Panel",
]

[boundaries.sets]
graphics = ["Graphics", "Shaders", "Renderer", "Interface/Canvas", "Interface/UI", "Interface/GUI", "Dashboard/View", "Dashboard/Panel", "Board/Graphics"]
headless = ["Game", "Strategy", "Simulation", "Core", "Text", "Board", "Dashboard/Feed"]
backends = ["**/backends/**"]
backend-header = ['re:^(?:Null|Metal|MacOS|Glfw)\w*\.(?:h|hpp)$']

[[boundaries.artifacts]]
path = "build/bin/**/libOryx.a"
deny = '\boryx::(?:Graphics|Shaders|Renderer|DrawList|Painter|ImContext|ImTheme|LayoutTree|UiContext|UiTheme|GuiContext|GuiTheme|ImId|UiId|GuiId|im|ui|gui|PresentedGraphicsBoard2D)::'
requires = ["!graphics"]
why = "graphics-off library must not export graphics symbols"

[docs]
tool = "mkdocs"

[plugins]
paths = ["build_system/oryx"]

[tool.oryx]
stubs-dir = "OryxPython/stubs"
