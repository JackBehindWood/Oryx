[project]
name = "Oryx"
description = "Game strategy engine"
license = "Apache-2.0"
repository = "https://github.com/JackBehindWood/Oryx"
default-target = "oasis"
forge-version = ">=0.2"

[premake]
version = "5.0.0-beta8"
generator = "gmake"

[build]
default-profile = "debug"
jobs = 0
dependencies-dir = "Oryx/vendor"
fetch = "auto"

[options]
python = { default = true, off = "--no-python", help = "Embedded Python backend" }
graphics = { default = true, off = "--no-graphics", help = "Window backends, RHI and 2D renderer" }
sanitize = { default = false, on = "--sanitize", help = "ASan+UBSan diagnostic build" }

[targets.oasis]
project = "Oasis"
presets.bench = ["--simulate=random,first-legal,100", "--benchmark", "--no-window"]

[tests]
project = "Tests"
suites.unit = "tests/unit"
suites.integration = "tests/integration"
suites.benchmark = { dir = "tests/benchmark", default = false }
suites.python = { dir = "tests/python", requires = ["python", "!sanitize"] }

[dependencies]
spdlog = { kind = "static", include = "include", sources = "src", defines = ["SPDLOG_COMPILED_LIB"] }
yaml-cpp = { kind = "static", include = "include", sources = "src" }
pybind11 = { include = "include", requires = ["python"] }
glfw = { kind = "static", include = "include", sources = "src", requires = ["graphics"] }
stb = { include = "." }
metal-cpp = { include = ".", requires = ["graphics"] }
doctest = { include = "doctest", path = "tests/vendor/doctest" }

[boundaries]
root = "Oryx/src"
base = "Oryx"
rules = [
  { rule = "** !-> backends", why = "public headers must not include backends/" },
  { rule = "backend-header <-only- Core/Window.cpp Graphics/RHI/RHI.cpp", why = "only the backend factories Core/Window.cpp, Graphics/RHI/RHI.cpp may include a backend header" },
  { rule = "Assets !-> Core/Window.h Core/Input.h Events/WindowEvent.h except Assets/**/GpuAssetCache*", why = "CPU assets must stay headless" },
  "headless !-> graphics",
  { rule = "Assets !-> graphics except Assets/**/GpuAssetCache*", why = "only GpuAssetCache may include {target}" },
  { rule = "graphics Text !-> Assets", why = "{module} must not include Assets; fonts reach the renderer through Text/IFontSource" },
  "Graphics < Shaders < Renderer < BoardGraphics",
]

[boundaries.sets]
graphics = ["Graphics", "Shaders", "Renderer", "BoardGraphics"]
headless = ["Game", "Strategy", "Simulation", "Core", "Text", "Board"]
backends = ["**/backends/**"]
backend-header = ['re:^(?:Null|Metal|MacOS|Glfw)\w*\.(?:h|hpp)$']

[[boundaries.artifacts]]
path = "build/bin/**/libOryx.a"
deny = '\boryx::(?:Graphics|Shaders|Renderer|PresentedGraphicsBoard)::'
requires = ["!graphics"]
why = "graphics-off library must not export graphics symbols"

[docs]
tool = "mkdocs"

[plugins]
paths = ["build_system/oryx"]

[tool.oryx]
stubs-dir = "OryxPython/stubs"
