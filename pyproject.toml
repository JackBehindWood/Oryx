[project]
name = "oryx"
version = "0.1.0"
description = "An open-source engine for games, strategies, simulation, and decision-making."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JackBehindWood" }
]
keywords = ["game-engine", "simulation", "strategy", "decision-making"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "questionary>=2.0.0",
]

[dependency-groups]
research = [
    "numpy>=2.1",
    "pandas>=2.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[tool.uv]
default-groups = ["research", "docs"]

[project.scripts]
build = "build_system.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["build_system"]

[tool.pyright]
stubPath = "Oryx/backends/Python/stubs"
reportMissingModuleSource = "none"
