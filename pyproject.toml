[tool.uv.workspace]
members = ["build_system/pyforge"]

[tool.uv]
package = false
default-groups = ["dev", "research", "docs"]

[tool.uv.sources]
pyforge = { workspace = true }

[dependency-groups]
dev = ["pyforge[menu,plugins]"]
research = [
    "ipykernel>=6.29",
    "numpy>=2.1",
    "pandas>=2.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]
stubs = [
    "pybind11-stubgen>=2.5",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pyright]
stubPath = "OryxPython/stubs"
reportMissingModuleSource = "none"
