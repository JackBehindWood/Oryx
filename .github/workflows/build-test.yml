name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: build (${{ matrix.os }}, ${{ matrix.cc }}, python ${{ matrix.python }}, CPython ${{ matrix.py }}, graphics ${{ matrix.graphics }})
    env:
      # Managed CPython ships a shared libpython, which the embedded scripting backend links.
      UV_PYTHON_PREFERENCE: only-managed
      BUILD_FLAGS: ${{ format('{0} {1}', matrix.python == 'off' && '--without python' || '', matrix.graphics == 'off' && '--without graphics' || '') }}
      CC: ${{ matrix.cc == 'clang' && 'clang' || '' }}
      CXX: ${{ matrix.cc == 'clang' && 'clang++' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc, python: "on", py: "3.11", graphics: "on" }
          - { os: ubuntu-24.04, cc: gcc, python: "off", py: "3.11", graphics: "on" }
          - { os: ubuntu-24.04, cc: gcc, python: "on", py: "3.11", graphics: "off" }
          - { os: ubuntu-24.04, cc: clang, python: "on", py: "3.11", graphics: "on" }
          # Newest CPython: annotations are evaluated lazily from 3.14 on.
          - { os: ubuntu-24.04, cc: gcc, python: "on", py: "3.14", graphics: "on" }
          - { os: macos-15, cc: clang, python: "on", py: "3.11", graphics: "on" }
          - { os: macos-15, cc: clang, python: "off", py: "3.11", graphics: "on" }
          - { os: macos-15, cc: clang, python: "on", py: "3.11", graphics: "off" }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Cache slangc
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pyforge/deps/slang
          ~/Library/Caches/pyforge/deps/slang
        key: slangc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('forge.toml') }}

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache

    - name: Set up build environment (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install make ccache

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.python }}-${{ matrix.py }}-${{ matrix.graphics }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.python }}-${{ matrix.py }}-${{ matrix.graphics }}-

    - name: Show the toolchain
      run: ${CXX:-c++} --version

    - name: Select CPython
      run: echo "UV_PYTHON=${{ matrix.py }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: uv sync --group test

    - name: Restore Premake binary cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/pyforge/premake' || '~/.cache/pyforge/premake' }}
        key: ${{ runner.os }}-${{ runner.arch }}-premake-${{ hashFiles('forge.toml') }}

    - name: Use ccache for CI builds
      run: uv run forge config set build.launcher ccache --local

    - name: Configure and compile
      run: uv run forge $BUILD_FLAGS compile

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.python }}-${{ matrix.py }}-${{ matrix.graphics }}-${{ github.sha }}

    - name: ccache statistics
      if: always()
      run: ccache -s

    - name: Check boundaries (includes, and graphics-off symbols)
      run: uv run forge $BUILD_FLAGS boundaries check --artifacts

    - name: Test (unit, integration, python when enabled)
      run: uv run forge $BUILD_FLAGS test

    - name: Run Oasis sandbox (headless, non-interactive)
      run: uv run forge $BUILD_FLAGS run -- --no-window --simulate=random,first-legal,10

    - name: Benchmark smoke run
      run: |
        output=$(uv run forge $BUILD_FLAGS run oasis:bench)
        echo "$output"
        echo "$output" | grep -q "Benchmark report"

  tooling:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
    - uses: actions/checkout@v4

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Test the Oryx plugin
      run: uv run --group test python -m pytest build_system/oryx/tests -q

    - name: Test pyforge
      working-directory: build_system/pyforge
      run: uv run --no-default-groups --group test pytest -q --cov=pyforge --cov-report=term

    - name: Smoke-test the forge CLI against a minimal project
      shell: bash
      run: |
        smoke="$RUNNER_TEMP/smoke"
        cp -r build_system/pyforge/tests/fixtures/hello "$smoke"
        forge() { uv run --no-default-groups --project "$GITHUB_WORKSPACE/build_system/pyforge" forge "$@"; }
        cd "$smoke"
        forge --help
        forge config show
        forge --dry-run configure

  extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Split pyforge into its own history
      run: |
        git subtree split --prefix=build_system/pyforge -b pyforge-extracted
        git worktree add "$RUNNER_TEMP/pyforge-extracted" pyforge-extracted

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Test the extracted tree in a fresh venv
      working-directory: ${{ runner.temp }}/pyforge-extracted
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -e ".[menu,plugins]" pytest
        pytest -q

  pip:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-pip-${{ github.sha }}
        restore-keys: ccache-pip-

    - name: Restore Premake binary cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pyforge/premake
        key: ${{ runner.os }}-${{ runner.arch }}-premake-${{ hashFiles('forge.toml') }}

    - name: Install pyforge and Oryx's dev dependencies with plain pip
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade "pip>=25.1"
        pip install -e "build_system/pyforge[menu,plugins]"
        pip install --group research pytest

    - name: Build and test (no uv involved)
      run: |
        source .venv/bin/activate
        forge config set build.launcher ccache --local
        forge all

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-pip-${{ github.sha }}

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build docs (strict)
      run: uv run forge docs build

  ci-ok:
    if: always()
    needs: [build, tooling, extraction, pip, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Every job passed or was deliberately skipped
      run: |
        if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
          echo "A required job failed or was cancelled"
          exit 1
        fi
