name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Set up build environment (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install make

    - name: Install dependencies
      run: uv sync

    - name: Configure, compile, and test
      run: uv run build build all

    - name: Run Oasis sandbox
      run: uv run build build run

    - name: Benchmark smoke run
      run: |
        output=$(uv run build build run --simulate=random,first-legal,100 --benchmark)
        echo "$output"
        echo "$output" | grep -q "Benchmark report"
