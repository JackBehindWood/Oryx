name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }}, python ${{ matrix.python }}, CPython ${{ matrix.py }})
    env:
      # Managed CPython ships a shared libpython, which the embedded scripting backend links.
      UV_PYTHON_PREFERENCE: only-managed
      BUILD_FLAGS: ${{ matrix.python == 'off' && '--without python' || '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["on", "off"]
        py: ["3.11"]
        include:
          # Newest CPython: annotations are evaluated lazily from 3.14 on.
          - os: ubuntu-latest
            python: "on"
            py: "3.14"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Set up build environment (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install make

    - name: Select CPython
      run: echo "UV_PYTHON=${{ matrix.py }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: uv sync

    - name: Configure and compile
      run: uv run forge $BUILD_FLAGS compile

    - name: Test (unit, integration, python when enabled)
      run: uv run forge $BUILD_FLAGS test

    - name: Run Oasis sandbox
      run: uv run forge $BUILD_FLAGS run

    - name: Benchmark smoke run
      run: |
        output=$(uv run forge $BUILD_FLAGS run oasis:bench)
        echo "$output"
        echo "$output" | grep -q "Benchmark report"

  tooling:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Test pyforge
      working-directory: build_system/pyforge
      run: uv run --no-default-groups --group test pytest -q --cov=pyforge --cov-report=term

  pip:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pyforge and Oryx's dev dependencies with plain pip
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade "pip>=25.1"
        pip install -e "build_system/pyforge[menu,plugins]"
        pip install --group research pytest

    - name: Build and test (no uv involved)
      run: |
        source .venv/bin/activate
        forge all

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build docs (strict)
      run: uv run forge docs build
