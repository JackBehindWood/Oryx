name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }}, python ${{ matrix.python }}, CPython ${{ matrix.py }})
    env:
      # Managed CPython ships a shared libpython, which the embedded scripting backend links.
      UV_PYTHON_PREFERENCE: only-managed
      BUILD_FLAGS: ${{ matrix.python == 'off' && '--no-python' || '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["on", "off"]
        py: ["3.11"]
        include:
          # Newest CPython: annotations are evaluated lazily from 3.14 on.
          - os: ubuntu-latest
            python: "on"
            py: "3.14"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up build environment (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Set up build environment (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install make

    - name: Select CPython
      run: echo "UV_PYTHON=${{ matrix.py }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: uv sync

    - name: Configure, compile, and test
      run: uv run forge $BUILD_FLAGS build all

    - name: Run Oasis sandbox
      run: uv run forge $BUILD_FLAGS build run

    - name: Benchmark smoke run
      run: |
        output=$(uv run forge $BUILD_FLAGS build run --simulate=random,first-legal,100 --benchmark)
        echo "$output"
        echo "$output" | grep -q "Benchmark report"

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build docs (strict)
      run: uv run forge docs build
